<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Matyi Suli TO-DO Dash</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matyi Suli TO-DO Dash">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #18202b; --muted: #6b7482; --faint: #9aa2ae; --line: #e2e5ea;
    --accent: #2563eb;
    --todo: #ea580c; --todo-soft: #fff1e7; --todo-ink: #9a3412;
    --urgent: #dc2626; --urgent-soft: #fdecec;
    --info: #64748b; --info-soft: #eef1f5;
    --ok: #16a34a; --chip: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #171c23; --text: #e9edf2; --muted: #98a2b0; --faint: #6b7482; --line: #262d37;
      --accent: #6aa0ff;
      --todo: #fb8a3c; --todo-soft: #2c1d12; --todo-ink: #ffc59c;
      --urgent: #f87171; --urgent-soft: #2e1616;
      --info: #94a3b8; --info-soft: #1d232c;
      --ok: #4ade80; --chip: #222934;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Fejléc */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  .fej { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
  .frissitve { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .gomb { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-size: 14px; }
  .gomb:disabled { opacity: .5; }
  .fulek { display: flex; gap: 4px; margin-top: 10px; background: var(--chip); padding: 3px; border-radius: 10px; }
  .ful { flex: 1; padding: 6px 0; border-radius: 8px; font-size: 14px; background: none; border: none; color: var(--muted); }
  .ful.aktiv { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  main { padding: 12px 14px 40px; max-width: 640px; margin: 0 auto; }

  /* Összegző sáv */
  .osszegzo { display: flex; gap: 8px; margin-bottom: 12px; }
  .osszegzo div { flex: 1; background: var(--card); border-radius: 12px; padding: 9px 12px; }
  .osszegzo b { display: block; font-size: 22px; line-height: 1.1; }
  .osszegzo span { font-size: 12px; color: var(--muted); }
  .osszegzo .t b { color: var(--todo); }
  .osszegzo .s b { color: var(--urgent); }

  /* Következő teendő kiemelés */
  .kovetkezo { background: var(--todo); color: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px;
    box-shadow: 0 4px 14px rgba(234,88,12,.25); }
  .kovetkezo.surgos { background: var(--urgent); box-shadow: 0 4px 14px rgba(220,38,38,.25); }
  .kovetkezo .felirat { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .kovetkezo .mikor { font-size: 24px; font-weight: 750; margin: 2px 0 4px; letter-spacing: -.01em; }
  .kovetkezo .mit { font-size: 17px; font-weight: 600; }
  .kovetkezo .alcim { font-size: 13px; color: #fff; opacity: .85; margin-top: 2px; }
  .kovetkezo button { margin-top: 10px; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.45);
    color: #fff; border-radius: 10px; padding: 7px 14px; font-size: 14px; font-weight: 600; }

  /* Idővonal */
  .nap { display: grid; grid-template-columns: 54px 1fr; gap: 0 10px; position: relative; }
  .nap::before { content: ''; position: absolute; left: 26px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .nap:last-child::before { bottom: 18px; }
  .datum { position: relative; z-index: 1; text-align: center; padding-top: 2px; }
  .datum .kor { background: var(--bg); padding: 4px 0; }
  .datum .hn { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
  .datum .sz { font-size: 22px; font-weight: 750; line-height: 1.05; }
  .datum .ho { font-size: 11px; color: var(--muted); }
  .nap.ma .datum .kor { background: var(--accent); color: #fff; border-radius: 12px; }
  .nap.ma .datum .hn, .nap.ma .datum .ho { color: #fff; }
  .napfej { font-size: 13px; color: var(--muted); margin: 6px 0 6px; font-weight: 600; }
  .napfej .rel { color: var(--text); }
  .tetelek { padding-bottom: 16px; }

  .tetel { border-radius: 14px; padding: 11px 13px; margin-bottom: 8px; background: var(--card); }
  .tetel.teendo { border-left: 5px solid var(--todo); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .tetel.teendo.surgos { border-left-color: var(--urgent); }
  .tetel.info { background: var(--info-soft); padding: 9px 12px; }
  .cimke { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .06em; }
  .cimke .p { padding: 2px 7px; border-radius: 6px; }
  .teendo .cimke .p { background: var(--todo-soft); color: var(--todo-ink); }
  .teendo.surgos .cimke .p { background: var(--urgent-soft); color: var(--urgent); }
  .info .cimke .p { background: var(--chip); color: var(--info); }
  .cimke .ido { font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--text); }
  .cimke .uj { background: var(--ok); color: #fff; }
  .cimke .fo { background: var(--urgent); color: #fff; }
  .mit { font-size: 16.5px; font-weight: 650; margin: 5px 0 2px; line-height: 1.3; }
  .info .mit { font-size: 15px; font-weight: 600; margin: 4px 0 1px; }
  .hatarido { display: inline-block; margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--todo-ink);
    background: var(--todo-soft); padding: 3px 8px; border-radius: 7px; }
  .surgos .hatarido { color: var(--urgent); background: var(--urgent-soft); }
  .alcim { font-size: 13.5px; color: var(--muted); }
  .ruha { margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--todo-ink); }
  .lista { list-style: none; padding: 0; margin: 8px 0 0; }
  .lista li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); }
  .lista input { width: 21px; height: 21px; margin: 0; flex: none; accent-color: var(--ok); }
  .lista label { flex: 1; font-size: 14.5px; }
  .lista li.kesz label { text-decoration: line-through; color: var(--muted); }
  .muveletek { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .kesz-gomb { background: var(--ok); color: #fff; border: none; border-radius: 9px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; }
  .lenyilo { background: none; border: none; padding: 4px 0; font-size: 13.5px; color: var(--accent); }
  .lenyilo::before { content: '▸ '; }
  .lenyilo.nyitva::before { content: '▾ '; }
  .nem-gomb { background: var(--chip); color: var(--muted); border: none; border-radius: 9px; padding: 6px 11px; font-size: 13.5px; font-weight: 600; }
  .kovetkezo .gombok { display: flex; gap: 8px; }
  .kovetkezo .gombok .halv { background: none; border-color: rgba(255,255,255,.3); font-weight: 500; }
  .elrejt { margin-left: auto; background: none; border: none; color: var(--faint); font-size: 13px; padding: 4px 0; }
  .panel { margin-top: 6px; font-size: 14px; }
  .reszlet { white-space: pre-wrap; }
  .forras { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .levelszoveg { white-space: pre-wrap; font-size: 13px; color: var(--muted); max-height: 320px; overflow: auto;
    background: var(--chip); padding: 8px; border-radius: 8px; margin-top: 6px; }

  .csoport { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 2px 8px; }
  .hiba { background: var(--urgent-soft); color: var(--urgent); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .ures { text-align: center; color: var(--muted); padding: 40px 10px; }
  .toltes { text-align: center; color: var(--muted); padding: 50px 0; }
  .lap { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .lap .targy { font-weight: 650; margin: 2px 0; }

  /* Naptár – havi nézet */
  .naptar { background: var(--card); border-radius: 16px; padding: 12px 10px 10px; }
  .navsor { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px; }
  .navsor .cim { font-size: 17px; font-weight: 700; text-transform: capitalize; }
  .nyil { background: var(--chip); border: none; border-radius: 9px; width: 34px; height: 30px; font-size: 16px; }
  .ma-gomb { background: none; border: none; color: var(--accent); font-size: 14px; margin-right: 6px; }
  .racs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .racs .nf { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 0 4px; }
  .cella { background: none; border: none; border-radius: 10px; padding: 5px 0 4px; min-height: 46px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cella .szam { font-size: 15px; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; text-align: center; }
  .cella.mas { opacity: .3; }
  .cella.hetvege .szam { color: var(--muted); }
  .cella.ma .szam { box-shadow: 0 0 0 2px var(--accent) inset; font-weight: 700; color: var(--accent); }
  .cella.valasztott .szam { background: var(--accent); color: #fff; box-shadow: none; }
  .pottyok { display: flex; gap: 3px; height: 6px; }
  .potty { width: 6px; height: 6px; border-radius: 50%; }
  .potty.t { background: var(--todo); } .potty.s { background: var(--urgent); }
  .potty.i { background: var(--info); opacity: .7; } .potty.k { background: var(--faint); opacity: .5; }
  .jelmagyarazat { display: flex; gap: 14px; justify-content: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .jelmagyarazat span { display: inline-flex; align-items: center; gap: 5px; }

  /* Naptár – heti nézet */
  .het { background: var(--card); border-radius: 16px; padding: 10px 12px; }
  .hetnap { display: grid; grid-template-columns: 42px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .hetnap:first-of-type { border-top: none; }
  .hetnap .bal { text-align: center; }
  .hetnap .bal .hn { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .hetnap .bal .sz { font-size: 18px; font-weight: 700; }
  .hetnap.ma .bal .sz { color: var(--accent); }
  .hetnap .ures-nap { font-size: 13px; color: var(--faint); padding-top: 8px; }
  .sor-tetel { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: none;
    padding: 5px 0 5px 9px; border-left: 3px solid var(--info); margin: 2px 0; border-radius: 0; }
  .sor-tetel.t { border-left-color: var(--todo); } .sor-tetel.s { border-left-color: var(--urgent); }
  .sor-tetel.kesz { opacity: .45; text-decoration: line-through; }
  .sor-tetel .ido { font-size: 13px; font-weight: 700; flex: none; }
  .sor-tetel .szoveg { font-size: 14.5px; flex: 1; }
  .sor-tetel .szoveg small { display: block; color: var(--muted); font-size: 12.5px; }
  .sor-tetel .tipus { font-size: 10px; font-weight: 800; letter-spacing: .05em; color: var(--muted); flex: none; }
  .sor-tetel.t .tipus { color: var(--todo); } .sor-tetel.s .tipus { color: var(--urgent); }
  .het-reszlet { margin: 4px 0 6px; }

  /* Felugró nap-lap */
  .hatter { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .lapalj { background: var(--bg); width: 100%; max-width: 640px; max-height: 82vh; overflow: auto;
    border-radius: 18px 18px 0 0; padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }
  .lapalj .fogo { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .lapalj .lapfej { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .lapalj .lapfej b { font-size: 18px; }

  .naptar-gomb { background: none; border: none; padding: 4px 0; font-size: 13.5px; color: var(--accent); }
  .naptar-jel { font-size: 12px; color: var(--ok); }
  .valaszto { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .valaszto .doboz { background: var(--card); width: 100%; max-width: 640px; border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); }
  .valaszto .doboz b { font-size: 17px; }
  .valaszto .opcio { display: block; width: 100%; margin-top: 10px; padding: 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); font-size: 16px; font-weight: 600; text-align: left; }
  .valaszto .opcio small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .valaszto .megse { display: block; width: 100%; margin-top: 10px; padding: 11px; background: none; border: none; color: var(--accent); font-size: 16px; }
  .uzenet { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90%; text-align: center; }

  .keret { margin: 26px 2px 0; padding: 12px 14px; border-radius: 12px; background: var(--card); font-size: 13px; color: var(--muted); }
  .keret .sor { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .keret b { color: var(--text); }
  .sav { flex: 1; height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .sav > div { height: 100%; background: var(--ok); }
  .sav > div.sok { background: var(--todo); }
</style>
</head>
<body>
<header>
  <div class="fej">
    <div>
      <h1>🎒 Matyi Suli TO-DO Dash</h1>
      <div class="frissitve" id="frissitve">Betöltés…</div>
    </div>
    <button class="gomb" id="frissitGomb" onclick="frissitesMost()">↻</button>
  </div>
  <div class="fulek">
    <button class="ful aktiv" data-ful="idovonal" onclick="fulValt(this)">Idővonal</button>
    <button class="ful" data-ful="naptar" onclick="fulValt(this)">Naptár</button>
    <button class="ful" data-ful="levelek" onclick="fulValt(this)">Levelek</button>
    <button class="ful" data-ful="kesz" onclick="fulValt(this)">Kész / múlt</button>
  </div>
</header>
<main id="tartalom"><div class="toltes">Betöltés…</div></main>
<div id="felugro"></div>
<div id="valaszto"></div>
<div id="uzenet"></div>

<script>
  // ===== Az Apps Script webalkalmazás címe (/exec végű) =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbwLj1ReUxz4A-OMWXU5b181wxFdwHlxxcR_sSNnQnMMBTD5QsRzckbckS4l30Lbbrs/exec';

  // Hívás az Apps Script felé, sütik nélkül (így nem számít, hány Google-fiókkal vagy bejelentkezve)
  function api(fn, args) {
    return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args || [] }), credentials: 'omit' })
      .catch(e => { throw new Error('Nincs kapcsolat a szerverrel.'); })
      .then(v => v.json())
      .then(j => { if (!j.ok) throw new Error(j.hiba); return j.eredmeny; });
  }

  const NAPOK = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];
  const NAP_ROVID = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'];
  const HONAPOK = ['jan.', 'febr.', 'márc.', 'ápr.', 'máj.', 'jún.', 'júl.', 'aug.', 'szept.', 'okt.', 'nov.', 'dec.'];
  let KULCS = null;
  try { KULCS = localStorage.getItem('iskolaKulcs'); } catch (e) {}
  let ADAT = null;
  let FUL = 'idovonal';
  const NYITOTT = new Set();

  /* ---------- segédek ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function dt(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function napKul(s) { return Math.round((dt(s) - dt(ADAT.ma)) / 864e5); }
  function napNev(s) { return NAPOK[dt(s).getDay()]; }
  function rovidDatum(s) { const d = dt(s); return HONAPOK[d.getMonth()] + ' ' + d.getDate() + '.'; }
  function relativ(n) {
    if (n === 0) return 'ma'; if (n === 1) return 'holnap'; if (n === 2) return 'holnapután';
    if (n < 0) return Math.abs(n) + ' napja'; if (n < 7) return n + ' nap múlva';
    return Math.round(n / 7) === 1 ? '1 hét múlva' : Math.round(n / 7) + ' hét múlva';
  }
  function nagybetu(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // Régi (az átállás előtti) tételeket is helyesen kezeli
  function teendoE(t) {
    if (t.tipus === 'teendo') return true;
    if (t.tipus === 'esemeny') return !!(t.teendo || (t.checklist && t.checklist.length) || t.ruhazat);
    return false;
  }
  // Melyik napra kerüljön az idővonalon
  function helyNap(t) { return teendoE(t) ? (t.hatarido || t.datum) : (t.datum || t.hatarido); }
  function vegNap(t) { return t.veg_datum && t.veg_datum > (helyNap(t) || '') ? t.veg_datum : helyNap(t); }
  function aktivE(t) { const v = vegNap(t); return !t.elrejtve && (!v || napKul(v) >= 0); }
  function surgosE(t) { const h = helyNap(t); return teendoE(t) && h && napKul(h) <= 1; }
  function idoTeendo(t) { return t.hatarido_ido || (!t.hatarido || t.hatarido === t.datum ? t.idopont : '') || ''; }

  /* ---------- szerverhívások ---------- */
  function adatJott(json) { ADAT = JSON.parse(json); rajzol(); }
  function hibaKezel(e) {
    if (/hozzáférés/i.test(e.message)) {
      try { localStorage.removeItem('iskolaKulcs'); } catch (x) {}
      KULCS = null; belepesMutat();
    } else alert('Hiba: ' + e.message);
  }
  function betolt() { if (KULCS) api('adatokLekerese', [KULCS]).then(adatJott).catch(hibaKezel); }
  function frissitesMost() {
    if (!KULCS) return belepesMutat();
    const g = document.getElementById('frissitGomb');
    g.disabled = true; g.textContent = '…';
    api('frissitesMost', [KULCS]).then(adatJott).catch(hibaKezel)
      .finally(() => { g.disabled = false; g.textContent = '↻'; });
  }
  function pipal(id, i, el) {
    const t = ADAT.tetelek.find(x => x.id === id);
    t.checklist[i].kesz = el.checked; rajzol();
    api('pipalas', [KULCS, id, i, el.checked]).then(adatJott).catch(e => { hibaKezel(e); betolt(); });
  }
  function elrejt(id, ertek, ok) {
    const t = ADAT.tetelek.find(x => x.id === id);
    t.elrejtve = ertek; t.modosult = false;
    if (ertek) t.elrejtesOka = ok || 'kesz'; else delete t.elrejtesOka;
    rajzol();
    if (ertek) uzenet(ok === 'nemerdekel' ? 'Áttéve: Kész / múlt → Nem érdekel' : '✓ Áttéve: Kész / múlt');
    api('elrejtes', [KULCS, id, ertek, ok || 'kesz']).then(adatJott).catch(e => { hibaKezel(e); betolt(); });
  }
  function nyit(k) { NYITOTT.has(k) ? NYITOTT.delete(k) : NYITOTT.add(k); rajzol(); }
  function fulValt(el) {
    document.querySelectorAll('.ful').forEach(f => f.classList.toggle('aktiv', f === el));
    FUL = el.dataset.ful; rajzol(); window.scrollTo(0, 0);
  }

  /* ---------- belépés ---------- */
  function belepesMutat(hiba) {
    ADAT = null;
    document.getElementById('frissitve').textContent = 'Belépés szükséges';
    document.getElementById('tartalom').innerHTML =
      '<div class="lap" style="margin-top:30px"><div class="mit">🔒 Belépés</div>' +
      '<div class="alcim">Írd be a jelszót. A telefon megjegyzi, legközelebb nem kell.</div>' +
      (hiba ? '<div class="hiba" style="margin:10px 0 0">' + esc(hiba) + '</div>' : '') +
      '<input id="jelszo" type="password" placeholder="Jelszó" autocomplete="current-password" ' +
      'style="width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid var(--line);' +
      'margin:14px 0;background:var(--bg);color:var(--text)">' +
      '<button class="kesz-gomb" id="belepGomb" style="width:100%;padding:12px;font-size:16px;background:var(--accent)" ' +
      'onclick="belep()">Belépés</button></div>';
    const m = document.getElementById('jelszo');
    m.addEventListener('keydown', e => { if (e.key === 'Enter') belep(); });
    m.focus();
  }
  function belep() {
    const g = document.getElementById('belepGomb');
    g.disabled = true; g.textContent = 'Ellenőrzés…';
    api('belepes', [document.getElementById('jelszo').value])
      .then(k => {
        KULCS = k;
        try { localStorage.setItem('iskolaKulcs', k); } catch (e) {}
        document.getElementById('tartalom').innerHTML = '<div class="toltes">Betöltés…</div>';
        betolt();
      })
      .catch(e => belepesMutat(e.message));
  }

  /* ---------- kártyák ---------- */
  function lenyilok(t) {
    const levelek = (t.forrasok || []).map(f => ADAT.levelek.find(l => l.id === f.levelId)).filter(Boolean);
    const rK = 'r-' + t.id, lK = 'l-' + t.id;
    let gombok = '', panelek = '';
    if (t.leiras) {
      gombok += '<button class="lenyilo' + (NYITOTT.has(rK) ? ' nyitva' : '') + '" onclick="nyit(\'' + rK + '\')">Részletek</button>';
      if (NYITOTT.has(rK)) panelek += '<div class="panel reszlet">' + esc(t.leiras) + '</div>';
    }
    if (levelek.length) {
      gombok += '<button class="lenyilo' + (NYITOTT.has(lK) ? ' nyitva' : '') + '" onclick="nyit(\'' + lK + '\')">Eredeti levél' +
        (levelek.length > 1 ? ' (' + levelek.length + ')' : '') + '</button>';
      if (NYITOTT.has(lK)) panelek += levelek.map(l =>
        '<div class="panel"><div class="forras" style="margin-top:0"><b>' + esc(l.targy) + '</b> · ' + esc(l.felado) + ' · ' +
        esc(new Date(l.datum).toLocaleDateString('hu-HU', { month: 'short', day: 'numeric' })) + '</div>' +
        '<div class="levelszoveg">' + esc(l.szoveg) + '</div></div>').join('');
    }
    return { gombok: gombok, panelek: panelek };
  }

  function naptarGomb(t) {
    if (!helyNap(t)) return '';
    const benne = Object.keys(t.naptarban || {});
    const nevek = (ADAT.naptarak || []).filter(n => benne.indexOf(n.id) >= 0).map(n => n.nev);
    return '<button class="naptar-gomb" onclick="valasztoNyit(\'' + t.id + '\')">📅 Naptárba</button>' +
      (nevek.length ? '<span class="naptar-jel">✓ ' + esc(nevek.join(', ')) + '</span>' : '');
  }

  function lista(t) {
    if (!t.checklist || !t.checklist.length) return '';
    return '<ul class="lista">' + t.checklist.map((c, i) =>
      '<li class="' + (c.kesz ? 'kesz' : '') + '"><input type="checkbox" id="c-' + t.id + '-' + i + '" ' +
      (c.kesz ? 'checked' : '') + ' onchange="pipal(\'' + t.id + '\',' + i + ',this)">' +
      '<label for="c-' + t.id + '-' + i + '">' + esc(c.szoveg) + '</label></li>').join('') + '</ul>';
  }

  function teendoKartya(t, archiv) {
    const ido = idoTeendo(t);
    const surgos = !archiv && surgosE(t);
    const mit = t.teendo || t.cim;
    const hataridoKulon = t.hatarido && t.datum && t.hatarido !== t.datum;
    const al = [t.teendo ? t.cim : '', t.datum && hataridoKulon ? 'program: ' + napNev(t.datum) + ', ' + rovidDatum(t.datum) : '',
      t.helyszin ? '📍 ' + t.helyszin : ''].filter(Boolean).map(esc).join(' · ');
    const l = lenyilok(t);
    return '<div class="tetel teendo' + (surgos ? ' surgos' : '') + '">' +
      '<div class="cimke"><span class="p">TEENDŐ</span>' + (ido ? '<span class="ido">' + esc(ido) + '</span>' : '') +
      (t.fontos ? '<span class="p fo">FONTOS</span>' : '') + (t.modosult && !archiv ? '<span class="p uj">MÓDOSULT</span>' : '') + '</div>' +
      '<div class="mit">' + esc(mit) + '</div>' +
      (al ? '<div class="alcim">' + al + '</div>' : '') +
      (t.hatarido && (hataridoKulon || !t.datum) ? '<div class="hatarido">⏰ Határidő: ' + napNev(t.hatarido) + ', ' + rovidDatum(t.hatarido) +
        (ido ? ' ' + esc(ido) : '') + '</div>' : '') +
      (t.ruhazat ? '<div class="ruha">👕 ' + esc(t.ruhazat) + '</div>' : '') +
      lista(t) +
      '<div class="muveletek">' +
        (archiv ? '<button class="gomb" style="padding:5px 10px;font-size:13px" onclick="elrejt(\'' + t.id + '\', false)">Visszaállít</button>'
                : '<button class="kesz-gomb" onclick="elrejt(\'' + t.id + '\', true, \'kesz\')">✓ Megcsináltam</button>' +
                  '<button class="nem-gomb" onclick="elrejt(\'' + t.id + '\', true, \'nemerdekel\')">Nem érdekel</button>') +
        l.gombok + naptarGomb(t) + '</div>' + l.panelek + '</div>';
  }

  function infoKartya(t, archiv) {
    const al = [t.idopont ? '🕘 ' + t.idopont : '', t.helyszin ? '📍 ' + t.helyszin : ''].filter(Boolean).map(esc).join(' · ');
    const l = lenyilok(t);
    return '<div class="tetel info">' +
      '<div class="cimke"><span class="p">INFÓ</span>' + (t.modosult && !archiv ? '<span class="p uj">MÓDOSULT</span>' : '') + '</div>' +
      '<div class="mit">' + esc(t.cim) + '</div>' +
      (al ? '<div class="alcim">' + al + '</div>' : '') +
      '<div class="muveletek">' + l.gombok + naptarGomb(t) +
        (archiv ? '<button class="elrejt" onclick="elrejt(\'' + t.id + '\', false)">Visszaállít</button>'
                : '<button class="elrejt" onclick="elrejt(\'' + t.id + '\', true, \'nemerdekel\')">Nem érdekel ✕</button>') +
      '</div>' + l.panelek + '</div>';
  }

  function kartya(t, archiv) { return teendoE(t) ? teendoKartya(t, archiv) : infoKartya(t, archiv); }

  function napBlokk(nap, tetelek) {
    const d = dt(nap), n = napKul(nap);
    return '<div class="nap' + (n === 0 ? ' ma' : '') + '">' +
      '<div class="datum"><div class="kor"><div class="hn">' + NAP_ROVID[d.getDay()] + '</div>' +
      '<div class="sz">' + d.getDate() + '</div><div class="ho">' + HONAPOK[d.getMonth()] + '</div></div></div>' +
      '<div class="tetelek"><div class="napfej"><span class="rel">' + nagybetu(relativ(n)) + '</span> · ' + napNev(nap) + '</div>' +
      tetelek.map(t => kartya(t, false)).join('') + '</div></div>';
  }

  /* ---------- naptár ---------- */
  let NAPTAR_HO = null;      // a megjelenített hónap első napja
  let HET_KEZDET = null;     // a heti nézet hétfője
  let FELUGRO_NAP = null;    // a felugró lapon mutatott nap

  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function hetfo(d) { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function napTetelei(nap) {
    return ADAT.tetelek.filter(t => {
      const h = helyNap(t);
      if (h && nap >= h && nap <= vegNap(t)) return true;
      return t.datum && t.datum !== h && nap >= t.datum && nap <= (t.veg_datum || t.datum);
    }).sort((a, b) => (teendoE(b) - teendoE(a)) || idoTeendo(a).localeCompare(idoTeendo(b)));
  }
  function keszE(t) { return !aktivE(t); }
  function pottyOsztaly(t) { return keszE(t) ? 'k' : teendoE(t) ? (surgosE(t) ? 's' : 't') : 'i'; }

  function honapLep(n) { NAPTAR_HO = new Date(NAPTAR_HO.getFullYear(), NAPTAR_HO.getMonth() + n, 1); rajzol(); }
  function hetLep(n) { HET_KEZDET = new Date(HET_KEZDET.getFullYear(), HET_KEZDET.getMonth(), HET_KEZDET.getDate() + 7 * n); rajzol(); }
  function maraUgrik() { const m = dt(ADAT.ma); NAPTAR_HO = new Date(m.getFullYear(), m.getMonth(), 1); HET_KEZDET = null; rajzol(); }
  function napNyit(nap) { FELUGRO_NAP = nap; HET_KEZDET = hetfo(dt(nap)); rajzol(); }
  function felugroBezar(e) { if (!e || e.target.id === 'hatter') { FELUGRO_NAP = null; rajzol(); } }

  function haviNezet() {
    if (!NAPTAR_HO) { const m = dt(ADAT.ma); NAPTAR_HO = new Date(m.getFullYear(), m.getMonth(), 1); }
    const elso = hetfo(NAPTAR_HO);
    let h = '<div class="naptar"><div class="navsor"><button class="nyil" onclick="honapLep(-1)">‹</button>' +
      '<span class="cim">' + NAPTAR_HO.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long' }) + '</span>' +
      '<span><button class="ma-gomb" onclick="maraUgrik()">Ma</button><button class="nyil" onclick="honapLep(1)">›</button></span></div>' +
      '<div class="racs">' + ['H', 'K', 'Sze', 'Cs', 'P', 'Szo', 'V'].map(x => '<div class="nf">' + x + '</div>').join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(elso.getFullYear(), elso.getMonth(), elso.getDate() + i);
      if (i >= 35 && d.getMonth() !== NAPTAR_HO.getMonth()) break;
      const nap = iso(d), tet = napTetelei(nap);
      const pottyok = tet.slice(0, 4).map(t => '<span class="potty ' + pottyOsztaly(t) + '"></span>').join('');
      h += '<button class="cella' + (d.getMonth() !== NAPTAR_HO.getMonth() ? ' mas' : '') + (i % 7 > 4 ? ' hetvege' : '') +
        (nap === ADAT.ma ? ' ma' : '') + (nap === FELUGRO_NAP ? ' valasztott' : '') + '" onclick="napNyit(\'' + nap + '\')">' +
        '<span class="szam">' + d.getDate() + '</span><span class="pottyok">' + pottyok + '</span></button>';
    }
    return h + '</div><div class="jelmagyarazat"><span><i class="potty s"></i>sürgős teendő</span>' +
      '<span><i class="potty t"></i>teendő</span><span><i class="potty i"></i>infó</span><span><i class="potty k"></i>kész</span></div></div>';
  }

  function hetiNezet() {
    if (!HET_KEZDET) {   // hétvégén már a következő hetet mutatja
      const m = dt(ADAT.ma);
      HET_KEZDET = hetfo(m.getDay() === 0 || m.getDay() === 6 ? new Date(m.getFullYear(), m.getMonth(), m.getDate() + 2) : m);
    }
    const veg = new Date(HET_KEZDET.getFullYear(), HET_KEZDET.getMonth(), HET_KEZDET.getDate() + 6);
    let h = '<div class="het"><div class="navsor"><button class="nyil" onclick="hetLep(-1)">‹</button>' +
      '<span class="cim" style="font-size:15px;text-transform:none">' + rovidDatum(iso(HET_KEZDET)) + ' – ' + rovidDatum(iso(veg)) + '</span>' +
      '<button class="nyil" onclick="hetLep(1)">›</button></div>';
    for (let i = 0; i < 7; i++) {
      const d = new Date(HET_KEZDET.getFullYear(), HET_KEZDET.getMonth(), HET_KEZDET.getDate() + i);
      const nap = iso(d), tet = napTetelei(nap);
      h += '<div class="hetnap' + (nap === ADAT.ma ? ' ma' : '') + '"><div class="bal"><div class="hn">' + NAP_ROVID[d.getDay()] + '</div>' +
        '<div class="sz">' + d.getDate() + '</div></div><div>';
      if (!tet.length) h += '<div class="ures-nap">–</div>';
      tet.forEach(t => {
        const k = 'w-' + nap + '-' + t.id, o = pottyOsztaly(t);
        const ido = teendoE(t) ? idoTeendo(t) : (t.idopont || '');
        h += '<button class="sor-tetel ' + (o === 'k' ? 'kesz' : o) + '" onclick="nyit(\'' + k + '\')">' +
          (ido ? '<span class="ido">' + esc(ido.split(/[–-]/)[0].trim()) + '</span>' : '') +
          '<span class="szoveg">' + esc(teendoE(t) ? (t.teendo || t.cim) : t.cim) +
          (teendoE(t) && t.teendo ? '<small>' + esc(t.cim) + '</small>' : '') + '</span>' +
          '<span class="tipus">' + (teendoE(t) ? 'TEENDŐ' : 'INFÓ') + '</span></button>';
        if (NYITOTT.has(k)) h += '<div class="het-reszlet">' + kartya(t, keszE(t)) + '</div>';
      });
      h += '</div></div>';
    }
    return h + '</div>';
  }

  function felugroRajzol() {
    const el = document.getElementById('felugro');
    if (!FELUGRO_NAP || !ADAT) { el.innerHTML = ''; return; }
    const tet = napTetelei(FELUGRO_NAP), n = napKul(FELUGRO_NAP);
    el.innerHTML = '<div class="hatter" id="hatter" onclick="felugroBezar(event)"><div class="lapalj"><div class="fogo"></div>' +
      '<div class="lapfej"><div><b>' + nagybetu(napNev(FELUGRO_NAP)) + ', ' + rovidDatum(FELUGRO_NAP) + '</b>' +
      '<div class="alcim">' + nagybetu(relativ(n)) + ' · ' + tet.length + ' tétel</div></div>' +
      '<button class="gomb" onclick="felugroBezar()">Bezár</button></div>' +
      (tet.length ? tet.map(t => kartya(t, keszE(t))).join('') : '<div class="ures" style="padding:24px">Erre a napra nincs semmi.</div>') +
      '</div></div>';
  }

  /* ---------- naptárba mentés ---------- */
  let VALASZTO = null;
  function valasztoNyit(id) { VALASZTO = id; valasztoRajzol(); }
  function valasztoBezar(e) { if (!e || e.target.id === 'valasztoHatter') { VALASZTO = null; valasztoRajzol(); } }
  function valasztoRajzol() {
    const el = document.getElementById('valaszto');
    const t = VALASZTO && ADAT && ADAT.tetelek.find(x => x.id === VALASZTO);
    if (!t) { el.innerHTML = ''; return; }
    const benne = t.naptarban || {};
    el.innerHTML = '<div class="valaszto" id="valasztoHatter" onclick="valasztoBezar(event)"><div class="doboz">' +
      '<b>Melyik naptárba kerüljön?</b><div class="alcim" style="margin-top:4px">' + esc(t.teendo || t.cim) + ' · ' +
      napNev(helyNap(t)) + ', ' + rovidDatum(helyNap(t)) + '</div>' +
      (ADAT.naptarak || []).map((n, i) =>
        '<button class="opcio" onclick="naptarbaMent(' + i + ')">📅 ' + esc(n.nev) +
        '<small>' + esc(n.id) + (benne[n.id] ? ' · már benne van, újramentés frissíti' : '') + '</small></button>').join('') +
      '<button class="megse" onclick="valasztoBezar()">Mégse</button></div></div>';
  }
  function naptarbaMent(i) {
    const id = VALASZTO, n = ADAT.naptarak[i];
    VALASZTO = null; valasztoRajzol();
    uzenet('Mentés a(z) ' + n.nev + ' naptárba…');
    api('naptarba', [KULCS, id, i])
      .then(j => { adatJott(j); uzenet('✓ Bekerült a(z) ' + n.nev + ' naptárba'); })
      .catch(e => { uzenet(''); hibaKezel(e); });
  }
  let uzenetIdozito = null;
  function uzenet(szoveg) {
    const el = document.getElementById('uzenet');
    clearTimeout(uzenetIdozito);
    el.innerHTML = szoveg ? '<div class="uzenet">' + esc(szoveg) + '</div>' : '';
    if (szoveg) uzenetIdozito = setTimeout(() => { el.innerHTML = ''; }, 3500);
  }

  /* ---------- rajzolás ---------- */
  function rajzol() {
    if (!ADAT) return;
    const f = ADAT.frissitve ? new Date(ADAT.frissitve) : null;
    document.getElementById('frissitve').textContent = f
      ? 'Frissítve: ' + f.toLocaleString('hu-HU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      : 'Még nem volt frissítés';

    let html = ADAT.utolsoHiba ? '<div class="hiba">⚠️ ' + esc(ADAT.utolsoHiba) + '</div>' : '';

    if (FUL === 'idovonal') {
      const aktiv = ADAT.tetelek.filter(aktivE);
      const teendok = aktiv.filter(teendoE).sort((a, b) =>
        ((helyNap(a) || '9999') + idoTeendo(a)).localeCompare((helyNap(b) || '9999') + idoTeendo(b)));
      const surgosDb = teendok.filter(surgosE).length;

      html += '<div class="osszegzo">' +
        '<div class="t"><b>' + teendok.length + '</b><span>nyitott teendő</span></div>' +
        '<div class="s"><b>' + surgosDb + '</b><span>ma / holnap</span></div>' +
        '<div><b>' + (aktiv.length - teendok.length) + '</b><span>infó</span></div></div>';

      const kov = teendok.find(t => helyNap(t));
      if (kov) {
        const h = helyNap(kov), n = napKul(h), ido = idoTeendo(kov);
        html += '<div class="kovetkezo' + (n <= 1 ? ' surgos' : '') + '">' +
          '<div class="felirat">Következő teendő · ' + relativ(n) + '</div>' +
          '<div class="mikor">' + nagybetu(napNev(h)) + (ido ? ' ' + esc(ido) : '') + '</div>' +
          '<div class="mit">' + esc(kov.teendo || kov.cim) + '</div>' +
          (kov.teendo ? '<div class="alcim">' + esc(kov.cim) + ' · ' + rovidDatum(h) + '</div>' : '<div class="alcim">' + rovidDatum(h) + '</div>') +
          '<div class="gombok"><button onclick="elrejt(\'' + kov.id + '\', true, \'kesz\')">✓ Megcsináltam</button>' +
          '<button class="halv" onclick="elrejt(\'' + kov.id + '\', true, \'nemerdekel\')">Nem érdekel</button></div></div>';
      }

      // napokra bontás
      const napok = {};
      aktiv.filter(helyNap).forEach(t => {
        const k = napKul(helyNap(t)) < 0 ? ADAT.ma : helyNap(t); // folyamatban lévő többnapos → ma
        (napok[k] = napok[k] || []).push(t);
      });
      const kulcsok = Object.keys(napok).sort();
      if (kulcsok.length) {
        html += '<div class="csoport">Idővonal</div>';
        kulcsok.forEach(k => {
          const lista = napok[k].sort((a, b) => (teendoE(b) - teendoE(a)) || idoTeendo(a).localeCompare(idoTeendo(b)));
          html += napBlokk(k, lista);
        });
      }
      const datumNelkul = aktiv.filter(t => !helyNap(t)).sort((a, b) => teendoE(b) - teendoE(a));
      if (datumNelkul.length) {
        html += '<div class="csoport">Dátum nélkül</div>' + datumNelkul.map(t => kartya(t, false)).join('');
      }
      if (!aktiv.length) html += '<div class="ures">🎉 Nincs közelgő teendő vagy infó.</div>';
    }

    if (FUL === 'naptar') {
      html += haviNezet() + '<div class="csoport">Heti nézet</div>' + hetiNezet();
    }

    if (FUL === 'levelek') {
      if (!ADAT.levelek.length) html += '<div class="ures">Még nincs feldolgozott levél.</div>';
      ADAT.levelek.forEach(l => {
        const k = 'lv-' + l.id;
        html += '<div class="lap"><div class="alcim">' +
          esc(new Date(l.datum).toLocaleDateString('hu-HU', { month: 'short', day: 'numeric', weekday: 'short' })) + ' · ' + esc(l.felado) + '</div>' +
          '<div class="targy">' + esc(l.targy) + '</div>' +
          '<div class="alcim" style="color:var(--text)">' + esc(l.osszefoglalo) + '</div>' +
          '<div class="muveletek"><button class="lenyilo' + (NYITOTT.has(k) ? ' nyitva' : '') + '" onclick="nyit(\'' + k + '\')">Eredeti levél</button></div>' +
          (NYITOTT.has(k) ? '<div class="levelszoveg">' + esc(l.szoveg) + '</div>' : '') + '</div>';
      });
    }

    if (FUL === 'kesz') {
      const archiv = ADAT.tetelek.filter(t => !aktivE(t))
        .sort((a, b) => (helyNap(b) || '').localeCompare(helyNap(a) || ''));
      const reszek = [
        ['✓ Megcsinált', archiv.filter(t => t.elrejtve && t.elrejtesOka !== 'nemerdekel')],
        ['Nem érdekel', archiv.filter(t => t.elrejtve && t.elrejtesOka === 'nemerdekel')],
        ['Lejárt', archiv.filter(t => !t.elrejtve)]
      ];
      if (!archiv.length) html += '<div class="ures">Itt jelennek meg az elvégzett, félretett és lejárt tételek.</div>';
      reszek.forEach(([nev, lista]) => {
        if (lista.length) html += '<div class="csoport">' + nev + ' (' + lista.length + ')</div>' + lista.map(t => kartya(t, true)).join('');
      });
    }

    if (ADAT.keret) {
      const k = ADAT.keret;
      const marad = Math.max(0, k.keretFt - k.elkoltottFt);
      const szazalek = Math.min(100, k.keretFt ? 100 * k.elkoltottFt / k.keretFt : 0);
      const ft = x => (x < 10 ? x.toFixed(1).replace('.', ',') : Math.round(x).toLocaleString('hu-HU')) + ' Ft';
      html += '<div class="keret">' +
        '<div class="sor"><span>Gemini keret – ' + esc(new Date().toLocaleDateString('hu-HU', { month: 'long' })) + '</span>' +
        '<span>Maradt: <b>~' + ft(marad) + '</b></span></div>' +
        '<div class="sav"><div class="' + (szazalek > 80 ? 'sok' : '') + '" style="width:' + szazalek + '%"></div></div>' +
        '<div class="sor" style="margin:6px 0 0"><span>Elköltve: ~' + ft(k.elkoltottFt) + ' / ' + ft(k.keretFt) + '</span>' +
        '<span>' + k.hivasok + ' levél</span></div></div>';
    }

    document.getElementById('tartalom').innerHTML = html;
    felugroRajzol();
  }

  KULCS ? betolt() : belepesMutat();
  setInterval(betolt, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) betolt(); });
</script>
</body>
</html>
